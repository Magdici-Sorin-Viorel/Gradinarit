<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grădinărit</title>
  <meta name="description" content="Grădinărit: calendarul grădinii pentru România, cu vremea locului tău – legume, pomi, arbuști, viță de vie, aromatice, flori și plante melifere.">
  <meta name="theme-color" content="#0f0e0e">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grădina">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Icons (local copy, works offline) -->
  <link rel="stylesheet" href="lib/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Desktop side menu (hidden on phones) -->
  <aside class="sb" aria-label="Meniu">
    <div class="sb-logo"><span class="sb-mark" aria-hidden="true">🌿</span><span class="nm">Grădinărit</span></div>
    <nav class="sb-nav">
      <a class="ni" href="#calendar" data-tab="calendar"><i class="fas fa-calendar-days" aria-hidden="true"></i><span>Calendar</span></a>
      <a class="ni" href="#plante" data-tab="plante"><i class="fas fa-seedling" aria-hidden="true"></i><span>Plante</span></a>
      <a class="ni" href="#gradina" data-tab="gradina"><i class="fas fa-heart" aria-hidden="true"></i><span>Grădina mea</span></a>
    </nav>
    <a class="ni" href="#setari" data-tab="setari"><i class="fas fa-gear" aria-hidden="true"></i><span>Setări și surse</span></a>
  </aside>

  <!-- Phone top bar -->
  <header class="tb">
    <span class="tb-logo" aria-hidden="true">🌿</span>
    <i class="fas fa-calendar-days tb-ico" id="tb-ico" aria-hidden="true"></i>
    <span class="tb-t" id="tb-title">Calendar</span>
    <a class="tb-btn" href="#setari" data-tab="setari" aria-label="Setări și surse"><i class="fas fa-gear" aria-hidden="true"></i></a>
  </header>

  <!-- The current page is rendered here by js/app.js -->
  <main id="view" class="main" tabindex="-1"></main>

  <!-- Plant detail sheet -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>

  <!-- Toast message -->
  <a id="page-close" class="page-close" href="#plante" aria-label="Închide pagina" hidden>✕</a>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Phone bottom navigation -->
  <nav class="mob-nav" aria-label="Navigare principală">
    <a class="mob-ni" href="#calendar" data-tab="calendar"><i class="fas fa-calendar-days" aria-hidden="true"></i><span>Calendar</span></a>
    <a class="mob-ni" href="#plante" data-tab="plante"><i class="fas fa-seedling" aria-hidden="true"></i><span>Plante</span></a>
    <a class="mob-ni" href="#gradina" data-tab="gradina"><i class="fas fa-heart" aria-hidden="true"></i><span>Grădina mea</span></a>
  </nav>

  <script src="js/data/core.js"></script>
  <script src="js/data/sources.js"></script>
  <script src="js/data/aromatic.js"></script>
  <script src="js/data/flowers.js"></script>
  <script src="js/data/trees.js"></script>
  <script src="js/data/shrubs.js"></script>
  <script src="js/data/vines.js"></script>
  <script src="js/data/climbers.js"></script>
  <script src="js/data/vegetables.js"></script>
  <script src="js/data/months.js"></script>
  <script src="js/data/orchard.js"></script>
  <script src="js/data/jobs.js"></script>
  <script src="js/data/soil.js"></script>
  <script src="js/data/hardiness.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/weather-advisor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
